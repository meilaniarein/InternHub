<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Konfirmasi status pengiriman lamaran InternHub.">
    <title>Application Submitted - InternHub</title>

    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z58y6lo2og");
</script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #111; background: #f5f6f8; font-family: Arial, Helvetica, sans-serif; }
        .browser-bar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: #e5eaf2; }
        .browser-dot { width: 18px; height: 18px; border-radius: 50%; }
        .red { background: #f16d70; } .yellow { background: #ffc252; } .green { background: #71c987; }
        .topbar { background: #fff; border-bottom: 1px solid #dedede; }
        .topbar-inner { max-width: 1440px; min-height: 80px; margin: 0 auto; padding: 12px 56px; display: flex; align-items: center; justify-content: space-between; }
        .back-link { display: inline-flex; align-items: center; gap: 12px; color: #111; font-size: 20px; text-decoration: none; }
        .back-link img { width: 24px; height: 24px; }
        .profile-link img { display: block; width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .page { max-width: 1440px; min-height: calc(100vh - 122px); margin: 0 auto; padding: 64px 24px; background: #fff; }
        .success-content { width: 100%; max-width: 520px; margin: 0 auto; padding-top: 12px; text-align: center; }
        .success-icon { display: flex; align-items: center; justify-content: center; width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%; background: #d2f1e2; }
        .success-icon svg { width: 68px; height: 68px; }
        h1 { margin: 0 0 14px; font-size: 28px; line-height: 1.25; }
        .success-message { max-width: 420px; margin: 0 auto; color: #858585; font-size: 16px; line-height: 1.6; }
        .application-summary { margin-top: 24px; padding: 16px; border: 1px solid #dedede; border-radius: 8px; text-align: left; }
        .application-summary p { margin: 6px 0; line-height: 1.5; }
        .success-actions { display: flex; flex-direction: column; align-items: center; gap: 22px; margin-top: 36px; }
        .applications-button { display: inline-flex; align-items: center; justify-content: center; width: 240px; min-height: 48px; padding: 12px 20px; border: 1px solid #1760ff; border-radius: 4px; color: #1760ff; background: #eff5ff; font-size: 16px; text-decoration: none; }
        .applications-button:hover { background: #dce9ff; }
        .browse-link { color: #1760ff; font-size: 16px; text-decoration: none; }
        .browse-link:hover { text-decoration: underline; }
        .simulation-note { margin-top: 28px; color: #777; font-size: 13px; line-height: 1.5; }
        @media (max-width: 600px) {
            .topbar-inner { min-height: 64px; padding: 10px 18px; }
            .back-link { font-size: 16px; }
            .profile-link img { width: 42px; height: 42px; }
            .page { min-height: calc(100vh - 106px); padding: 54px 20px; }
            .success-icon { width: 100px; height: 100px; margin-bottom: 24px; }
            .success-icon svg { width: 58px; height: 58px; }
            h1 { font-size: 24px; }
            .success-message { font-size: 14px; }
            .success-actions { margin-top: 30px; }
        }
    </style>
</head>
<body>
    <div class="browser-bar" aria-hidden="true">
        <span class="browser-dot red"></span><span class="browser-dot yellow"></span><span class="browser-dot green"></span>
    </div>
    <header class="topbar">
        <nav class="topbar-inner" aria-label="Navigasi halaman sukses">
            <a class="back-link" href="FieldInternship.html">
                <img src="./assets/images/Icon-Back.svg" alt=""><span>Back to Internships</span>
            </a>
            <a class="profile-link" href="Applications.html" aria-label="Lihat aplikasi saya">
                <img src="./assets/images/Gambar-FotoPersona.png" alt="Foto profil pengguna" width="50" height="50">
            </a>
        </nav>
    </header>
    <main class="page">
        <section class="success-content" aria-labelledby="success-title">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                    <path d="M9 33L25 49L56 17" stroke="#087A32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </div>
            <h1 id="success-title">Application Submitted!</h1>
            <p class="success-message" id="success-message">Lamaran berhasil disimpan.</p>
            <div class="application-summary" id="application-summary">
                <p><strong>Posisi:</strong> <span id="success-position">UI/UX Design Intern</span></p>
                <p><strong>Perusahaan:</strong> <span id="success-company">TechCo</span></p>
                <p><strong>Status:</strong> Submitted</p>
            </div>
            <div class="success-actions">
                <a class="applications-button" href="Applications.html">View My Applications</a>
                <a class="browse-link" href="FieldInternship.html">Back to Browse Internship</a>
            </div>
            <p class="simulation-note"></p>
        </section>
    </main>
    <script>
        try {
            const application = JSON.parse(sessionStorage.getItem("internhub-last-application") || "null");
            if (application) {
                document.getElementById("success-position").textContent =
                    application.title || application.position || "Internship";
                document.getElementById("success-company").textContent =
                    application.company || "Perusahaan";
                document.getElementById("success-message").textContent =
                    "Lamaran kamu berhasil disimpan.";
            }
        } catch (error) {
            // Konten default tetap ditampilkan jika data sesi tidak tersedia.
        }
    </script>
</body>
</html>
