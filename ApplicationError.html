
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Informasi ketika pengiriman lamaran mengalami kendala."
    >
    <title>Application Error - InternHub</title>

    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z58y6lo2og");
</script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .browser-bar {
            height: 24px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 14px;
            background: #e5eaf2;
        }

        .browser-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .red {
            background: #f16d70;
        }

        .yellow {
            background: #ffc252;
        }

        .green {
            background: #71c987;
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
        }

        .topbar-inner {
            min-height: 48px;
            max-width: 1440px;
            margin: 0 auto;
            padding: 8px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #111;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link img {
            width: 20px;
            height: 20px;
        }

        .profile-link img {
            display: block;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .page {
            max-width: 1440px;
            min-height: calc(100vh - 72px);
            margin: 0 auto;
            padding: 52px 20px;
            background: #fff;
        }

        .error-content {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            text-align: center;
        }

        .error-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #ffd4d4;
            color: #f04444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 76px;
            font-weight: 400;
            line-height: 1;
        }

        .error-content h1 {
            margin: 0 0 12px;
            font-size: 20px;
            line-height: 1.3;
        }

        .error-message {
            margin: 0 auto;
            max-width: 300px;
            color: #858585;
            font-size: 11px;
            line-height: 1.5;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 40px;
        }

        .button {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            border: 1px solid #1760ff;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .button-primary {
            background: #1760ff;
            color: #fff;
        }

        .button-secondary {
            background: #fff;
            color: #1760ff;
        }

        .button-primary:hover {
            background: #064bdc;
        }

        .button-secondary:hover {
            background: #eff5ff;
        }

        @media (max-width: 480px) {
            .topbar-inner {
                padding: 8px 16px;
            }

            .page {
                padding: 48px 16px;
            }

            .error-icon {
                width: 96px;
                height: 96px;
                font-size: 66px;
            }

            .error-actions {
                margin-top: 32px;
            }
        }
    </style>
</head>

<body>
    <div class="browser-bar" aria-hidden="true">
        <span class="browser-dot red"></span>
        <span class="browser-dot yellow"></span>
        <span class="browser-dot green"></span>
    </div>

    <header class="topbar">
        <nav class="topbar-inner" aria-label="Navigasi halaman error">
            <a class="back-link" href="ApplicationReview.html">
                <img src="./assets/images/Icon-Back.svg" alt="">
                <span>Back</span>
            </a>

            <a
                class="profile-link"
                href="Applications.html"
                aria-label="Lihat aplikasi saya"
            >
                <img
                    src="./assets/images/Gambar-FotoPersona.png"
                    alt="Foto profil pengguna"
                    width="32"
                    height="32"
                >
            </a>
        </nav>
    </header>

    <main class="page">
        <section class="error-content" aria-labelledby="error-title">
            <div class="error-icon" aria-hidden="true">!</div>

            <h1 id="error-title">Something Went Wrong</h1>

            <p class="error-message">
                We couldn’t submit your application at the moment.
                Please try again later.
            </p>

            <div class="error-actions">
                <a
                    class="button button-primary"
                    href="ApplicationReview.html"
                >
                    Try Again
                </a>

                <a
                    class="button button-secondary"
                    href="DetailLowongan.html"
                >
                    Back to Detail Page
                </a>
            </div>
        </section>
    </main>
</body>
</html>
