
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Isi informasi pribadi untuk melamar magang di InternHub.">
    <title>Personal Information - InternHub</title>
</head>
<body>
    <header>
        <nav aria-label="Navigasi halaman">
            <a href="internship-detail.html">
                <img src="./assets/images/Icon-Back.svg" alt="" width="24" height="24">
                Back to Detail
            </a>

            <a href="profile.html" aria-label="Profil pengguna">
                <img src="./assets/images/Gambar-FotoPersona.png" alt="Foto profil pengguna" width="48" height="48">
            </a>
        </nav>
    </header>

    <main>
        <section aria-label="Progress lamaran">
            <div>
                <img src="./assets/images/Icon-1.svg" alt="" width="48" height="48">
                <p><strong>Personal Information</strong></p>
            </div>
            <div>
                <img src="./assets/images/Icon-2.svg" alt="" width="48" height="48">
                <p>Application Detail</p>
            </div>
            <div>
                <img src="./assets/images/Icon-3.svg" alt="" width="48" height="48">
                <p>Review &amp; Submit</p>
            </div>
        </section>

        <section aria-labelledby="personal-title">
            <h1 id="personal-title">Personal Information</h1>
            <p>Isi data diri kamu untuk melanjutkan proses lamaran.</p>

            <form action="ApplicationStep2.html" method="get">
                <p>
                    <label for="full-name">Full Name</label><br>
                    <input type="text" id="full-name" name="full-name" placeholder="Nama lengkap kamu" required>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" placeholder="email@domain.com" required>
                </p>

                <p>
                    <label for="phone">Phone Number</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx" required>
                </p>

                <p>
                    <label for="university">University</label><br>
                    <select id="university" name="university" required>
                        <option value="">Pilih universitas</option>
                        <option value="Trisakti School of Management">Trisakti School of Management</option>
                        <option value="Universitas Trisakti">Universitas Trisakti</option>
                        <option value="BINUS University">BINUS University</option>
                        <option value="Universitas Indonesia">Universitas Indonesia</option>
                        <option value="Other">Lainnya</option>
                    </select>
                </p>

                <p>
                    <label for="major">Major</label><br>
                    <select id="major" name="major" required>
                        <option value="">Pilih jurusan</option>
                        <option value="Management">Management</option>
                        <option value="Digital Business">Digital Business</option>
                        <option value="Information Systems">Information Systems</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Design">Design</option>
                        <option value="Other">Lainnya</option>
                    </select>
                </p>

                <p>
                    <label for="graduation">Expected Graduation</label><br>
                    <select id="graduation" name="graduation" required>
                        <option value="">Pilih tahun</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                    </select>
                </p>

                <button type="submit">Save &amp; Continue ›</button>
            </form>
        </section>
    </main>
</body>
</html>
