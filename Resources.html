
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Berbagai informasi dan tips untuk mendukung perjalanan magang kamu melalui InternHub."
    >
    <title>Resources - InternHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            color: #080808;
            font-family: Arial, Helvetica, sans-serif;
        }

        .browser-bar {
            height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            background-color: #e5eaf2;
        }

        .browser-dot {
            width: 17px;
            height: 17px;
            border-radius: 50%;
        }

        .red {
            background-color: #ff696b;
        }

        .yellow {
            background-color: #ffc252;
        }

        .green {
            background-color: #70cd85;
        }

        .page-frame {
            width: calc(100% - 24px);
            max-width: 1440px;
            min-height: calc(100vh - 54px);
            margin: 0 auto;
            background-color: #ffffff;
        }

        .topbar {
            border-bottom: 1px solid #e5e5e5;
        }

        .topbar-inner {
            min-height: 74px;
            padding: 12px 5.2%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .brand {
            display: block;
            flex-shrink: 0;
        }

        .brand img {
            display: block;
            width: 100px;
            height: auto;
        }

        .navigation ul {
            display: flex;
            align-items: center;
            gap: 48px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .navigation a {
            color: #777777;
            font-size: 18px;
            text-decoration: none;
            white-space: nowrap;
        }

        .navigation a[aria-current="page"] {
            color: #155cff;
        }

        .profile {
            display: block;
            flex-shrink: 0;
        }

        .profile img {
            display: block;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        main {
            min-height: 850px;
            padding: 30px 5.2% 60px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 36px;
            line-height: 1.2;
        }

        .intro {
            margin: 0 0 42px;
            color: #858585;
            font-size: 18px;
            line-height: 1.5;
        }

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 40px;
            margin: 0;
            padding: 0 3px;
        }

        .resource-card {
            min-width: 0;
            min-height: 220px;
            padding: 17px 16px 20px;
            border-radius: 10px;
            background-color: #eaf6fd;
            text-align: center;
        }

        .resource-card img {
            display: block;
            width: 100%;
            height: 110px;
            margin: 0 auto 20px;
            object-fit: cover;
        }

        .resource-card h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
        }

        @media (max-width: 1050px) {
            .topbar-inner {
                padding-right: 24px;
                padding-left: 24px;
                gap: 20px;
            }

            .navigation ul {
                gap: 24px;
            }

            .navigation a {
                font-size: 15px;
            }

            main {
                padding-right: 28px;
                padding-left: 28px;
            }

            .resource-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px;
            }
        }

        @media (max-width: 600px) {
            .page-frame {
                width: calc(100% - 16px);
            }

            .topbar-inner {
                flex-wrap: wrap;
                gap: 16px;
                padding: 14px 16px;
            }

            .navigation {
                order: 3;
                width: 100%;
                overflow-x: auto;
            }

            .navigation ul {
                width: max-content;
                gap: 22px;
                padding-bottom: 4px;
            }

            main {
                min-height: 600px;
                padding: 24px 16px 40px;
            }

            h1 {
                font-size: 30px;
            }

            .intro {
                margin-bottom: 28px;
                font-size: 16px;
            }

            .resource-grid {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 0;
            }

            .resource-card {
                min-height: 0;
                padding: 16px;
            }

            .resource-card img {
                height: 170px;
                margin-bottom: 16px;
            }

            .resource-card h2 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <div class="browser-bar" aria-hidden="true">
        <span class="browser-dot red"></span>
        <span class="browser-dot yellow"></span>
        <span class="browser-dot green"></span>
    </div>

    <div class="page-frame">
        <header class="topbar">
            <div class="topbar-inner">
                <a
                    class="brand"
                    href="Branda.html"
                    aria-label="InternHub Home"
                >
                    <img
                        src="./assets/images/Icon-InternHub.svg"
                        alt="InternHub"
                        width="100"
                    >
                </a>

                <nav class="navigation" aria-label="Navigasi utama">
                    <ul>
                        <li>
                            <a href="FieldInternship.html">
                                Field Internship
                            </a>
                        </li>
                        <li>
                            <a href="Saved.html">Saved</a>
                        </li>
                        <li>
                            <a href="Applications.html">Application</a>
                        </li>
                        <li>
                            <a href="Resources.html" aria-current="page">
                                Resources
                            </a>
                        </li>
                    </ul>
                </nav>

                <a
                    class="profile"
                    href="Applications.html"
                    aria-label="Lihat aplikasi saya"
                >
                    <img
                        src="./assets/images/Gambar-FotoPersona.png"
                        alt="Foto profil pengguna"
                        width="48"
                        height="48"
                    >
                </a>
            </div>
        </header>

        <main>
            <h1>Resources</h1>

            <p class="intro">
                Berbagai informasi dan tips untuk mendukung perjalanan
                magang kamu.
            </p>

            <section
                class="resource-grid"
                aria-label="Informasi dan tips magang"
            >
                <article class="resource-card">
                    <img
                        src="./assets/images/Gambar-Resources1.png"
                        alt="Contoh CV dan resume di laptop"
                        width="300"
                        height="110"
                    >
                    <h2>CV &amp; Resume Tips</h2>
                </article>

                <article class="resource-card">
                    <img
                        src="./assets/images/Gambar-Resources2.png"
                        alt="Ruang kantor untuk persiapan wawancara"
                        width="300"
                        height="110"
                    >
                    <h2>Interview Preparation</h2>
                </article>

                <article class="resource-card">
                    <img
                        src="./assets/images/Gambar-Resources3.png"
                        alt="Laptop menampilkan contoh portofolio"
                        width="300"
                        height="110"
                    >
                    <h2>Build Your Portfolio</h2>
                </article>

                <article class="resource-card">
                    <img
                        src="./assets/images/Gambar-Resources4.png"
                        alt="Seseorang menulis catatan tentang magang"
                        width="300"
                        height="110"
                    >
                    <h2>Finding the Right Internship</h2>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
